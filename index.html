<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Caderno de Receitas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="food-strip">
    <!-- Bule -->
    <svg viewBox="0 0 90 90" class="doodle">
      <path d="M25 40 C24 66 30 76 45 76 C60 76 66 66 65 40 Z" fill="#e8c97a" stroke="#4a3a2a" stroke-width="1.6" opacity="0.85"/>
      <path d="M65 46 C80 42 82 58 68 58" fill="none" stroke="#4a3a2a" stroke-width="1.6"/>
      <path d="M25 44 C10 50 14 62 26 60" fill="none" stroke="#4a3a2a" stroke-width="1.6"/>
      <path d="M45 40 L38 20 C36 16 40 12 45 16 C50 12 54 16 52 20 L45 40" fill="#e8c97a" stroke="#4a3a2a" stroke-width="1.6" opacity="0.85"/>
      <ellipse cx="45" cy="40" rx="20" ry="5" fill="none" stroke="#4a3a2a" stroke-width="1.4"/>
      <path d="M58 14 C60 10 64 12 62 16" fill="none" stroke="#a89a86" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <!-- Croissant -->
    <svg viewBox="0 0 90 90" class="doodle">
      <path d="M14 58 C24 34 44 22 60 26 C76 30 82 46 74 58 C70 50 60 46 52 48 C58 52 60 58 56 62 C50 56 42 54 36 56 C40 60 40 64 36 66 C28 62 20 60 14 58 Z"
        fill="#dba85f" stroke="#4a3a2a" stroke-width="1.6" opacity="0.9"/>
    </svg>
    <!-- Pote de geleia -->
    <svg viewBox="0 0 90 90" class="doodle">
      <rect x="26" y="34" width="38" height="40" rx="6" fill="#d97a3f" stroke="#4a3a2a" stroke-width="1.6" opacity="0.85"/>
      <rect x="22" y="24" width="46" height="12" rx="3" fill="#f2e6c9" stroke="#4a3a2a" stroke-width="1.6"/>
      <rect x="32" y="48" width="26" height="14" rx="2" fill="#fff8ec" stroke="#4a3a2a" stroke-width="1.2"/>
      <path d="M28 24 C28 16 62 16 62 24" fill="none" stroke="#4a3a2a" stroke-width="1.4"/>
    </svg>
    <!-- Batedor com tigela -->
    <svg viewBox="0 0 90 90" class="doodle">
      <path d="M22 54 C22 70 68 70 68 54 Z" fill="#e9dcc4" stroke="#4a3a2a" stroke-width="1.6"/>
      <ellipse cx="45" cy="54" rx="23" ry="7" fill="#a9c48f" stroke="#4a3a2a" stroke-width="1.6"/>
      <path d="M45 50 L45 20" stroke="#8a6a44" stroke-width="4" stroke-linecap="round"/>
      <path d="M36 50 C30 38 34 26 45 20 C56 26 60 38 54 50" fill="none" stroke="#4a3a2a" stroke-width="1.6"/>
    </svg>
    <!-- Xícara de café -->
    <svg viewBox="0 0 90 90" class="doodle">
      <ellipse cx="45" cy="68" rx="34" ry="7" fill="#e3dccb" stroke="#4a3a2a" stroke-width="1.4"/>
      <path d="M20 40 C20 58 30 66 45 66 C60 66 70 58 70 40 Z" fill="#f4f0e6" stroke="#4a3a2a" stroke-width="1.6"/>
      <ellipse cx="45" cy="40" rx="25" ry="7" fill="#8a5a3a" stroke="#4a3a2a" stroke-width="1.6"/>
      <path d="M70 44 C84 42 84 58 70 56" fill="none" stroke="#4a3a2a" stroke-width="1.6"/>
    </svg>
  </div>

  <header>
    <h1>Meu Caderno de Receitas</h1>
    <p class="subtitle">Suas receitinhas queridas, todas guardadinhas aqui.</p>
  </header>

  <main>
    <section class="form-section">
      <h2>Nova receita</h2>
      <form id="recipe-form">
        <label for="nome">Nome da receita</label>
        <input type="text" id="nome" required placeholder="Ex: Bolo de fubá">

        <label for="ingredientes">Ingredientes (um por linha)</label>
        <textarea id="ingredientes" required placeholder="2 ovos&#10;1 xícara de açúcar&#10;1 xícara de fubá"></textarea>

        <label for="modo">Modo de preparo</label>
        <textarea id="modo" required placeholder="Descreva o passo a passo..."></textarea>

        <button type="submit">Salvar receita</button>
      </form>
    </section>

    <section class="list-section">
      <h2>Receitas guardadas</h2>
      <div id="recipe-list" class="recipe-list">
        <!-- as receitas aparecem aqui automaticamente -->
      </div>
      <p id="empty-message" class="empty-message">Você ainda não tem receitas guardadas. Adicione a primeira ao lado!</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
