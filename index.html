    <h1>Meu Caderno de Receitas</h1>
    <p class="subtitle" id="saudacao">Suas receitinhas queridas, todas guardadinhas aqui.</p>
  </header>

  <main>
    <section class="form-section">
      <h2>Nova receita</h2>
      <form id="recipe-form">
        <label for="nome">Nome da receita</label>
        <input type="text" id="nome" required placeholder="Ex: Bolo de fubá">

        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="">Selecione...</option>
          <option value="Café da manhã">Café da manhã</option>
          <option value="Almoço/Janta">Almoço/Janta</option>
          <option value="Lanche da tarde">Lanche da tarde</option>
          <option value="Sobremesa">Sobremesa</option>
        </select>

        <label>Dificuldade</label>
        <div class="star-picker" id="star-picker" data-valor="0">
          <span class="star" data-valor="1">★</span>
          <span class="star" data-valor="2">★</span>
          <span class="star" data-valor="3">★</span>
          <span class="star" data-valor="4">★</span>
          <span class="star" data-valor="5">★</span>
        </div>

        <label>Visibilidade</label>
        <div class="visibility-picker">
          <label class="radio-label"><input type="radio" name="visibilidade" value="privada" checked> Privada (só eu vejo)</label>
          <label class="radio-label"><input type="radio" name="visibilidade" value="publica"> Pública (todos veem)</label>
        </div>

        <label for="ingredientes">Ingredientes (um por linha)</label>
        <textarea id="ingredientes" required placeholder="2 ovos&#10;1 xícara de açúcar&#10;1 xícara de fubá"></textarea>

        <label for="modo">Modo de preparo</label>
        <textarea id="modo" required placeholder="Descreva o passo a passo..."></textarea>

        <button type="submit" id="submit-btn">Salvar receita</button>
        <button type="button" id="cancel-btn" class="cancel-btn" style="display:none;">Cancelar edição</button>
      </form>
    </section>

    <section class="list-section">
      <h2>Receitas</h2>
      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="Todas">Todas</button>
        <button class="filter-btn" data-filter="Café da manhã">Café da manhã</button>
        <button class="filter-btn" data-filter="Almoço/Janta">Almoço/Janta</button>
        <button class="filter-btn" data-filter="Lanche da tarde">Lanche da tarde</button>
        <button class="filter-btn" data-filter="Sobremesa">Sobremesa</button>
      </div>
      <div id="recipe-list" class="recipe-list">
        <!-- as receitas aparecem aqui automaticamente -->
      </div>
      <p id="empty-message" class="empty-message">Nenhuma receita por aqui ainda. Adicione a primeira ao lado!</p>
    </section>
  </main>
