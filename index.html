<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Caderno de Receitas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="food-strip">
    <!-- Cupcake -->
    <svg viewBox="0 0 64 64" class="doodle">
      <path d="M14 30 L50 30 L45 56 Q32 60 19 56 Z" fill="#f7c8d9"/>
      <path d="M14 30 L50 30 L48 38 L16 38 Z" fill="#fff" opacity="0.5"/>
      <path d="M18 30 C18 14 46 14 46 30 C40 26 24 26 18 30 Z" fill="#fbe3b0"/>
      <circle cx="32" cy="12" r="4" fill="#f4879c"/>
    </svg>
    <!-- Batedor -->
    <svg viewBox="0 0 64 64" class="doodle">
      <path d="M32 8 L32 30" stroke="#c9a26a" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M22 30 C18 44 20 54 32 58 C44 54 46 44 42 30" stroke="#e29ab0" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M28 30 C26 42 27 50 32 54 C37 50 38 42 36 30" stroke="#e29ab0" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <!-- Cereja -->
    <svg viewBox="0 0 64 64" class="doodle">
      <path d="M30 10 C34 22 40 26 40 26" stroke="#7fae7a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M30 10 C26 20 22 24 22 24" stroke="#7fae7a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="22" cy="40" r="12" fill="#e2536b"/>
      <circle cx="42" cy="38" r="12" fill="#f4879c"/>
      <ellipse cx="18" cy="35" rx="3" ry="2" fill="#fff" opacity="0.5"/>
    </svg>
    <!-- Biscoito -->
    <svg viewBox="0 0 64 64" class="doodle">
      <circle cx="32" cy="32" r="24" fill="#e3b483"/>
      <circle cx="24" cy="24" r="3.5" fill="#8a5a2b"/>
      <circle cx="38" cy="22" r="3" fill="#8a5a2b"/>
      <circle cx="42" cy="36" r="3.5" fill="#8a5a2b"/>
      <circle cx="26" cy="40" r="3" fill="#8a5a2b"/>
      <circle cx="34" cy="34" r="2.5" fill="#8a5a2b"/>
    </svg>
    <!-- Xícara -->
    <svg viewBox="0 0 64 64" class="doodle">
      <path d="M14 26 L46 26 L43 46 Q30 52 17 46 Z" fill="#cdeedd"/>
      <path d="M46 30 C56 28 56 42 45 40" stroke="#8fc9a8" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M20 20 C22 16 20 14 22 10" stroke="#c8b7ad" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M28 20 C30 16 28 14 30 10" stroke="#c8b7ad" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <header>
    <h1>Meu Caderno de Receitas</h1>
    <svg viewBox="0 0 120 70" class="chef-hat">
      <ellipse cx="60" cy="55" rx="34" ry="10" fill="#f4879c"/>
      <path d="M30 50 C20 30 30 14 46 16 C48 6 66 6 68 16 C84 12 96 30 84 50 Z" fill="#fff" stroke="#f6d8cf" stroke-width="2"/>
    </svg>
    <p class="subtitle">Suas receitinhas queridas, todas guardadinhas aqui.</p>
  </header>

  <main>
    <section class="form-section">
      <h2>Nova receita</h2>
      <form id="recipe-form">
        <label for="nome">Nome da receita</label>
        <input type="text" id="nome" required placeholder="Ex: Bolo de fubá">

        <label for="ingredientes">Ingredientes (um por linha)</label>
        <textarea id="ingredientes" required placeholder="2 ovos&#10;1 xícara de açúcar&#10;1 xícara de fubá"></textarea>

        <label for="modo">Modo de preparo</label>
        <textarea id="modo" required placeholder="Descreva o passo a passo..."></textarea>

        <button type="submit">Salvar receita</button>
      </form>
    </section>

    <section class="list-section">
      <h2>Receitas guardadas</h2>
      <div id="recipe-list" class="recipe-list">
        <!-- as receitas aparecem aqui automaticamente -->
      </div>
      <p id="empty-message" class="empty-message">Você ainda não tem receitas guardadas. Adicione a primeira ao lado!</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
